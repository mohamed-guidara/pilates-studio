<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <form (ngSubmit)="login()" #loginForm="ngForm" class="bg-white p-8 rounded shadow-md w-96 space-y-4">

    <h2 class="text-2xl font-bold text-center">Login</h2>

    <input type="email" name="email" [(ngModel)]="email" required email placeholder="Email"
      class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-400" />

    <input type="password" name="password" [(ngModel)]="password" required placeholder="Password"
      class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-400" />

    <button type="submit" [disabled]="loginForm.invalid"
      class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 disabled:opacity-50">
      Login 
    </button>
  </form>
</div>
