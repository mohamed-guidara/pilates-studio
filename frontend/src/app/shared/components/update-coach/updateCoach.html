@if (coach() && coachPerson()) {
  <div class="max-w-md mx-auto bg-white shadow rounded p-6">
    <h2 class="text-lg font-semibold mb-4 text-gray-800">Update Coach</h2>

    <form (ngSubmit)="saveCoach()" class="space-y-4">
      <!-- First Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
        <input type="text"
               [ngModel]="coachPerson()!.firstName"
               (ngModelChange)="updatePersonField('firstName', $event)"
               name="firstName"
               class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300" />
      </div>

      <!-- Last Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
        <input type="text"
               [ngModel]="coachPerson()!.lastName"
               (ngModelChange)="updatePersonField('lastName', $event)"
               name="lastName"
               class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300" />
      </div>

      <!-- Birth Date -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Birth Date</label>
        <input type="date"
               [ngModel]="coachPerson()!.birthDate"
               (ngModelChange)="updatePersonField('birthDate', $event)"
               name="birthDate"
               class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300" />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email"
               [ngModel]="coachPerson()!.email"
               (ngModelChange)="updatePersonField('email', $event)"
               name="email"
               class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300" />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password"
               [ngModel]="password()"
               (ngModelChange)="password.set($event)"
               name="password"
               class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300" />
      </div>

      <!-- Role -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
        <select [ngModel]="coach()!.isAdmin"
                (ngModelChange)="updateCoachField('isAdmin', $event)"
                name="isAdmin"
                class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300">
          <option [value]="1">Admin</option>
          <option [value]="0">Coach</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between space-x-4 pt-4">
        <button type="submit"
                class="cursor-pointer flex-1 px-4 py-2 rounded bg-blue-600 text-white font-medium hover:bg-blue-700 focus:ring focus:ring-blue-300">
          Save Changes
        </button>
        <button type="button"
                routerLink="/admin/coaches"
                class="cursor-pointer flex-1 px-4 py-2 rounded bg-gray-200 text-gray-700 font-medium hover:bg-gray-300 focus:ring focus:ring-gray-400">
          Cancel
        </button>
      </div>
    </form>
  </div>
} @else {
  <div class="text-center p-6 text-gray-600">
    <p>Please wait, loading coach data...</p>
  </div>
}
