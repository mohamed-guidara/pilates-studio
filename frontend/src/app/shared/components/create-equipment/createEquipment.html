@if (show()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
  <div class="w-full max-w-lg transform overflow-hidden rounded-xl bg-white p-6 text-left align-middle shadow-2xl transition-all">
    <h2 class="text-xl font-bold mb-5 text-gray-800">Create Equipment</h2>

    <form (ngSubmit)="saveNewEquipment()" class="max-h-[80vh] overflow-y-auto pr-2">
      @if (apiError()) {
        <feedback-message [message]="apiError()" type="error"></feedback-message>
      }

      <label class="block mb-1 text-sm font-medium text-gray-700">Room ID</label>
      <input
        type="number"
        [(ngModel)]="newEquipment.roomId"
        name="roomId"
        min="1"
        required
        class="w-full border border-gray-300 rounded-md px-3 py-2 mb-4 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />

      <label class="block mb-1 text-sm font-medium text-gray-700">Equipment Name</label>
      <input
        type="text"
        [(ngModel)]="newEquipment.name"
        name="equipmentName"
        required
        class="w-full border border-gray-300 rounded-md px-3 py-2 mb-4 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />

      <label class="block mb-1 text-sm font-medium text-gray-700">Description</label>
      <textarea
        [(ngModel)]="newEquipment.description"
        name="description"
        rows="3"
        required
        class="w-full border border-gray-300 rounded-md px-3 py-2 mb-4 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      ></textarea>

      <div class="flex items-center mb-6 mt-4">
        <input
          type="checkbox"
          [ngModel]="newEquipment.isAvailable === 1"
          (ngModelChange)="newEquipment.isAvailable = $event ? 1 : 0"
          name="isAvailable"
          id="isAvailableCheckbox"
          class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
        />
        <label for="isAvailableCheckbox" class="ml-2 block text-sm font-medium text-gray-700 cursor-pointer">
          Available
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="closeCreateModal()" class="px-4 py-2 rounded-md bg-gray-200 font-medium text-gray-700 transition-colors hover:bg-gray-300">
          Cancel
        </button>
        <button type="submit" class="px-4 py-2 rounded-md bg-green-500 font-medium text-white transition-colors hover:bg-green-600 shadow-sm">
          Create
        </button>
      </div>
    </form>
  </div>
</div>
}
