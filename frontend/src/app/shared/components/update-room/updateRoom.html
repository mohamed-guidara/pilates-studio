@if (room()) {
  <div class="max-w-md mx-auto bg-white shadow rounded p-6">
    <h2 class="text-lg font-semibold mb-4 text-gray-800">Update Room</h2>

    @if (pageErrorMessage()) {
      <feedback-message [message]="pageErrorMessage()" type="error"></feedback-message>
    } @else if (successMessage()) {
      <feedback-message [message]="successMessage()" type="success"></feedback-message>
    }

    <form (ngSubmit)="saveRoom()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Room Number</label>
        <input type="text"
               [ngModel]="room()!.number"
               (ngModelChange)="updateRoomField('number', $event)"
               name="roomNumber"
               class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Capacity</label>
        <input type="number"
               [ngModel]="room()!.capacity"
               (ngModelChange)="updateRoomField('capacity', $event)"
               name="capacity"
               min="1"
               class="w-full border rounded px-3 py-2 focus:ring focus:ring-blue-300" />
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox"
               [ngModel]="room()!.isAvailable === 1"
               (ngModelChange)="updateRoomField('isAvailable', $event ? 1 : 0)"
               name="isAvailable"
               id="isAvailableCheckbox"
               class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer" />
        <label for="isAvailableCheckbox" class="text-sm font-medium text-gray-700 cursor-pointer">Available</label>
      </div>

      <div class="flex justify-between space-x-4 pt-4">
        <button type="button"
                routerLink="/admin/rooms"
                class="cursor-pointer flex-1 px-4 py-2 rounded bg-gray-200 text-gray-700 font-medium hover:bg-gray-300 focus:ring focus:ring-gray-400">
          Cancel
        </button>
        <button type="submit"
                class="cursor-pointer flex-1 px-4 py-2 rounded bg-blue-600 text-white font-medium hover:bg-blue-700 focus:ring focus:ring-blue-300">
          Save Changes
        </button>
      </div>
    </form>
  </div>
} @else {
  <div class="text-center p-6 text-gray-600">
    <p>Please wait, loading room data...</p>
  </div>
}
